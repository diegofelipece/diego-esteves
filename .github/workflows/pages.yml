name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [root, repository]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure site base path
        run: |
          if [ "$BUILD_PATH" = "root" ]; then
            echo "SITE_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "SITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi
        env:
          BUILD_PATH: ${{ matrix.path }}

      - name: Lint and type-check
        run: npm run lint && npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          CMS_OAUTH_URL: ${{ vars.CMS_OAUTH_URL }}

      - name: Validate static output
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify portfolio interactions
        run: npm run test:e2e

      - name: Set custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.path == 'root' && vars.PAGES_CUSTOM_DOMAIN == 'diegoesteves.ink'
        run: echo 'diegoesteves.ink' > out/CNAME

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && ((matrix.path == 'root' && vars.PAGES_CUSTOM_DOMAIN == 'diegoesteves.ink') || (matrix.path == 'repository' && vars.PAGES_CUSTOM_DOMAIN != 'diegoesteves.ink'))
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && ((matrix.path == 'root' && vars.PAGES_CUSTOM_DOMAIN == 'diegoesteves.ink') || (matrix.path == 'repository' && vars.PAGES_CUSTOM_DOMAIN != 'diegoesteves.ink'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
